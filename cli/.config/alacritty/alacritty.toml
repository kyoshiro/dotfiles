[general]
import = ["~/.config/alacritty/colors/ashokai-urple.toml"]
live_config_reload = true

[env]
TERM = "screen-256color"

[font]
size = 11

[font.bold]
family = "NotoSansMono"
style = "Bold"

[font.bold_italic]
family = "NotoSansMono"
style = "Bold Italic"

[font.italic]
family = "NotoSansMono"
style = "Italic"

[font.normal]
style = "Regular"
family = "NotoSansMono"

[font.offset]
x = 1
y = 2

[window]
decorations = "Transparent"
dynamic_padding = true
opacity = 0.85

[window.padding]
x = 4
y = 4
